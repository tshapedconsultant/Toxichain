name: CI

on:
  pull_request:
  push:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install contract dependencies
        run: npm ci
      - name: Compile contracts
        run: npm run compile
      - name: Run contract tests
        run: npm test
      - name: Install moderator dependencies
        run: npm ci --prefix moderator
      - name: Run moderator tests
        run: npm run test:moderator
